<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0A0A0C;
  --surface: #131315;
  --card: #1A1A1D;
  --card-hover: #222225;
  --border: #2A2A2E;
  --accent: #B2EE37;
  --accent-dim: rgba(178,238,55,0.12);
  --accent-glow: rgba(178,238,55,0.25);
  --accent-secondary: #58F670;
  --text: #F5F5F5;
  --text-sec: #9A9A9E;
  --text-muted: #5A5A5E;
  --danger: #FF4757;
  --success: #2ED573;
  --warning: #FFA502;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
}
html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
input, button, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}
.login-screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
  text-align: center;
}
.login-logo {
  width: 72px; height: 72px;
  background: var(--accent-dim);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
  font-size: 32px;
}
.login-title { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
.login-sub { font-size: 14px; color: var(--text-sec); margin: 0 0 40px; line-height: 1.5; }
.login-btn {
  display: flex; align-items: center; gap: 12px;
  background: #fff; color: #333;
  border: none; border-radius: 12px;
  padding: 14px 28px;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.login-btn svg { width: 20px; height: 20px; }
.sync-indicator {
  position: fixed; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); z-index: 500; transition: background 0.3s;
}
.sync-indicator.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-indicator.offline { background: var(--text-muted); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.header {
  padding: 16px 20px 12px;
  background: var(--bg);
  position: sticky; top: 0; z-index: 10;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.greeting { font-size: 13px; color: var(--text-sec); font-weight: 400; }
.greeting strong { color: var(--text); font-weight: 700; font-size: 18px; display: block; margin-top: 2px; }
.profile-switcher { display: flex; gap: 6px; align-items: center; }
.profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent; color: #fff;
}
.profile-avatar.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.profile-avatar:not(.active) { opacity: 0.45; }
.profile-avatar:not(.active):hover { opacity: 0.7; }
.week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.week-nav button {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-sec); width: 30px; height: 30px;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.15s;
}
.week-nav button:hover { background: var(--card-hover); color: var(--text); }
.week-nav span { flex: 1; text-align: center; font-size: 13px; color: var(--text-sec); font-weight: 500; }
.days-row { display: flex; gap: 6px; }
.day-tab {
  flex: 1; text-align: center; padding: 8px 4px;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: all 0.2s; background: transparent;
  border: 1px solid transparent; position: relative;
}
.day-tab:hover { background: var(--card); }
.day-tab.active { background: var(--accent); border-color: var(--accent); }
.day-tab.active .day-name { color: #0A0A0C; }
.day-tab.active .day-num { color: #0A0A0C; }
.day-tab.completed::after {
  content: ''; position: absolute; bottom: 3px; left: 50%;
  transform: translateX(-50%); width: 5px; height: 5px;
  border-radius: 50%; background: var(--accent);
}
.day-tab.active.completed::after { background: #0A0A0C; }
.day-tab.rest { opacity: 0.5; }
.day-name { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.day-num { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 0 100px; scroll-behavior: smooth; }
.view { display: none; padding: 0 20px 20px; }
.view.active { display: block; }
.muscle-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.muscle-badge { background: var(--accent-dim); color: var(--accent); font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; letter-spacing: 0.3px; }
.progress-bar-container { margin-bottom: 18px; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sec); margin-bottom: 6px; font-weight: 500; }
.progress-bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-secondary)); border-radius: 3px; transition: width 0.4s ease; }
.exercise-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; transition: all 0.2s; cursor: pointer; }
.exercise-card:hover { border-color: #3A3A3E; }
.exercise-card.done { border-color: var(--accent-glow); background: color-mix(in srgb, var(--accent) 4%, transparent); }
.exercise-top { display: flex; align-items: flex-start; gap: 12px; }
.exercise-check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; margin-top: 2px; padding: 0; }
.exercise-check:hover { border-color: var(--accent); }
.exercise-check.checked { background: var(--accent); border-color: var(--accent); }
.exercise-check svg { width: 14px; height: 14px; }
.exercise-info { flex: 1; min-width: 0; }
.exercise-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.exercise-card.done .exercise-name { color: var(--text-sec); }
.exercise-sets { font-size: 12px; color: var(--text-sec); font-weight: 500; }
.exercise-sets span { color: var(--accent); font-weight: 600; }
.exercise-body-map { width: 52px; height: 70px; flex-shrink: 0; }
.exercise-body-map svg { width: 100%; height: 100%; }
.exercise-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: none; }
.exercise-card.expanded .exercise-detail { display: block; }
.exercise-instruction { font-size: 12px; color: var(--text-sec); line-height: 1.5; margin-bottom: 12px; }
.sets-tracker { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-radius: var(--radius-xs); font-size: 12px; }
.set-row.done { background: var(--accent-dim); }
.set-num { width: 28px; height: 28px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: var(--text-sec); flex-shrink: 0; border: 1px solid var(--border); }
.set-row.done .set-num { background: var(--accent); color: #0A0A0C; border-color: var(--accent); }
.set-inputs { display: flex; gap: 6px; flex: 1; }
.set-input { width: 60px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 5px 6px; color: var(--text); font-size: 13px; font-weight: 600; text-align: center; outline: none; font-family: inherit; font-variant-numeric: tabular-nums; }
.set-input:focus { border-color: var(--accent); }
.set-input::placeholder { color: var(--text-muted); font-weight: 400; font-size: 10px; }
.set-label { font-size: 9px; color: var(--text-muted); text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.set-check-btn { width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; transition: all 0.2s; }
.set-check-btn:hover { border-color: var(--accent); }
.set-check-btn.checked { background: var(--accent); border-color: var(--accent); }
.set-check-btn svg { width: 14px; height: 14px; }
.rest-timer { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; padding: 10px; background: var(--surface); border-radius: var(--radius-sm); }
.timer-display { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); min-width: 70px; text-align: center; }
.timer-display.running { color: var(--accent); }
.timer-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.timer-btn.start { background: var(--accent); color: #0A0A0C; }
.timer-btn.stop { background: var(--danger); color: white; }
.timer-btn.reset { background: var(--card); color: var(--text-sec); border: 1px solid var(--border); }
.timer-btn:hover { filter: brightness(1.1); }
.timer-btn svg { width: 16px; height: 16px; }
.timer-presets { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.timer-preset { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--text-sec); cursor: pointer; transition: all 0.15s; }
.timer-preset:hover { border-color: var(--accent); color: var(--accent); }
.timer-preset.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.sets-header { display: flex; gap: 8px; padding: 0 10px; margin-bottom: 4px; }
.sets-header span { font-size: 9px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.sets-header .sh-set { width: 28px; text-align: center; }
.sets-header .sh-kg { width: 60px; text-align: center; }
.sets-header .sh-reps { width: 60px; text-align: center; }
.sets-header .sh-spacer { width: 28px; }
.rest-day { text-align: center; padding: 60px 20px; }
.rest-day-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
.rest-day h3 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
.rest-day p { font-size: 14px; color: var(--text-sec); margin: 0; }
.section-title { font-size: 18px; font-weight: 700; margin: 24px 0 14px; color: var(--text); }
.section-title:first-child { margin-top: 8px; }
.stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.stat-card.accent { border-color: var(--accent-glow); background: color-mix(in srgb, var(--accent) 4%, transparent); }
.stat-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 16px; }
.stat-icon.green { background: var(--accent-dim); }
.stat-icon.blue { background: rgba(100,149,237,0.12); }
.stat-icon.orange { background: rgba(255,165,2,0.12); }
.stat-icon.red { background: rgba(255,71,87,0.12); }
.stat-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 11px; color: var(--text-sec); font-weight: 500; margin-top: 2px; letter-spacing: 0.3px; }
.weight-input-row { display: flex; gap: 10px; margin-bottom: 20px; }
.weight-input-row input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: border-color 0.2s; }
.weight-input-row input:focus { border-color: var(--accent); }
.weight-input-row input::placeholder { color: var(--text-muted); font-weight: 400; }
.btn { background: var(--accent); color: #0A0A0C; border: none; border-radius: var(--radius-sm); padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn.secondary:hover { background: var(--card-hover); filter: none; }
.btn.danger { background: var(--danger); color: white; }
.btn.small { padding: 8px 14px; font-size: 12px; }
.chart-container { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.chart-title { font-size: 13px; font-weight: 600; }
.chart-value { font-size: 22px; font-weight: 800; color: var(--accent); }
.chart-subtitle { font-size: 11px; color: var(--text-sec); }
.chart-svg { width: 100%; display: block; }
.bar-chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { width: 90px; font-size: 12px; color: var(--text-sec); font-weight: 500; text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 20px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; min-width: 2px; }
.bar-value { font-size: 11px; font-weight: 600; color: var(--text-sec); width: 30px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px; }
.heatmap-label { font-size: 10px; color: var(--text-muted); text-align: center; font-weight: 600; padding-bottom: 4px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 4px; background: var(--surface); }
.heatmap-cell.trained { background: var(--accent-dim); }
.heatmap-cell.trained-full { background: var(--accent); opacity: 0.7; }
.heatmap-cell.future { opacity: 0.3; }
.heatmap-cell.today { outline: 2px solid var(--accent); outline-offset: -1px; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(10,10,12,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: var(--text-muted); transition: color 0.2s; background: none; border: none; font-family: inherit; }
.nav-item:hover { color: var(--text-sec); }
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }
.nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 200; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; padding: 20px; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-close { background: var(--card); border: none; color: var(--text-sec); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; display: block; }
.form-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; }
.form-input:focus { border-color: var(--accent); }
.edit-exercise-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--card); border-radius: var(--radius-sm); margin-bottom: 6px; }
.edit-exercise-item .name { flex: 1; font-size: 13px; font-weight: 500; }
.edit-exercise-item .detail { font-size: 11px; color: var(--text-sec); }
.edit-exercise-item button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 16px; }
.edit-exercise-item button:hover { color: var(--danger); }
.weight-history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.weight-history-item:last-child { border-bottom: none; }
.weight-history-item .date { color: var(--text-sec); }
.weight-history-item .value { font-weight: 700; font-variant-numeric: tabular-nums; }
.weight-history-item .change { font-size: 11px; font-weight: 600; }
.weight-history-item .change.down { color: var(--accent); }
.weight-history-item .change.up { color: var(--danger); }
.profile-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.15s; }
.profile-card:hover { background: var(--card-hover); }
.profile-card-left { display: flex; align-items: center; gap: 12px; }
.profile-card-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; }
.profile-card-icon svg { width: 18px; height: 18px; color: var(--accent); }
.profile-card-text .label { font-size: 14px; font-weight: 600; }
.profile-card-text .sub { font-size: 11px; color: var(--text-sec); margin-top: 1px; }
.profile-card-arrow { color: var(--text-muted); font-size: 14px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--card); border: 1px solid var(--accent); color: var(--text); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; z-index: 300; transition: transform 0.3s ease; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
.user-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-sec);
}
.user-bar img { width: 24px; height: 24px; border-radius: 50%; }
.user-bar .ub-name { flex: 1; font-weight: 500; }
.user-bar button {
  background: none; border: none; color: var(--text-muted);
  font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 500;
  padding: 4px 8px; border-radius: 4px;
}
.user-bar button:hover { color: var(--text-sec); background: var(--card); }
@media (min-width: 481px) { .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
</style>
</head>
<body>

<div class="app" id="app">
  <div id="loginScreen" class="login-screen">
    <div class="login-logo">&#128170;</div>
    <h1 class="login-title">FitTrack</h1>
    <p class="login-sub">Controle seus treinos e acompanhe sua evolução.<br>Sincronizado entre todos os seus dispositivos.</p>
    <button class="login-btn" onclick="googleLogin()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>

const firebaseConfig = {

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
const db = firebase.firestore();
let currentUser = null;
let saveTimer = null;
let unsubscribeSnapshot = null;
let ignoreNextSnapshot = false;

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  auth.signInWithPopup(provider).catch(e => {
    if (e.code === 'auth/popup-blocked') showToast('Permita popups para entrar');
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') showToast('Erro ao entrar: ' + e.message);
  });
}
function logout() { auth.signOut(); }

auth.onAuthStateChanged(async user => {
  currentUser = user;
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    const main = document.getElementById('mainApp');
    main.style.display = 'flex';
    document.getElementById('syncIndicator').style.display = 'block';
    renderUserBar();
    await loadFromFirestore();
    startRealtimeSync();
    renderAll();
  } else {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('syncIndicator').style.display = 'none';
  }
});

function renderUserBar() {
  const bar = document.getElementById('userBar');
  if (!currentUser) return;
  const photo = currentUser.photoURL;
  const name = currentUser.displayName || currentUser.email;
  bar.innerHTML = `${photo ? '<img src="'+photo+'" alt="">' : ''}<span class="ub-name">${name}</span><button onclick="logout()">Sair</button>`;
}

function setSyncStatus(s) {
  const el = document.getElementById('syncIndicator');
  el.className = 'sync-indicator' + (s === 'syncing' ? ' syncing' : s === 'offline' ? ' offline' : '');
}

async function loadFromFirestore() {
  if (!currentUser) return;
  setSyncStatus('syncing');
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      const data = doc.data();
      if (data.activeProfile && PROFILES[data.activeProfile]) state.currentProfile = data.activeProfile;
      if (data.profiles) {
        Object.keys(PROFILES).forEach(pid => {
          if (data.profiles[pid]) {
            try { localStorage.setItem(storageKey(pid), JSON.stringify(data.profiles[pid])); } catch(e) {}
          }
        });
      }
    }
    loadProfile(state.currentProfile);
    setSyncStatus('ok');
  } catch(e) {
    loadProfile(state.currentProfile);
    setSyncStatus('offline');
  }
}

function saveToFirestore() {
  if (!currentUser) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    setSyncStatus('syncing');
    ignoreNextSnapshot = true;
    try {
      const profiles = {};
      Object.keys(PROFILES).forEach(pid => {
        try {
          const raw = localStorage.getItem(storageKey(pid));
          if (raw) profiles[pid] = JSON.parse(raw);
        } catch(e) {}
      });
      await db.collection('users').doc(currentUser.uid).set({
        activeProfile: state.currentProfile,
        profiles,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      setSyncStatus('ok');
    } catch(e) {
      setSyncStatus('offline');
      ignoreNextSnapshot = false;
    }
  }, 1500);
}

function startRealtimeSync() {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  if (!currentUser) return;
  unsubscribeSnapshot = db.collection('users').doc(currentUser.uid)
    .onSnapshot(doc => {
      if (ignoreNextSnapshot) { ignoreNextSnapshot = false; return; }
      if (!doc.exists) return;
      const data = doc.data();
      if (!data.profiles) return;
      const pid = state.currentProfile;
      if (data.profiles[pid]) {
        try { localStorage.setItem(storageKey(pid), JSON.stringify(data.profiles[pid])); } catch(e) {}
        const d = data.profiles[pid];
        if (d.completed) state.completed = d.completed;
        if (d.weightLog) state.weightLog = d.weightLog;
        if (d.workouts) state.workouts = d.workouts;
        if (d.setLogs) state.setLogs = d.setLogs;
        renderAll();
        setSyncStatus('ok');
      }
    }, err => { setSyncStatus('offline'); });
}

function getBodySVG(v,m) { return v==='front'?bodyFront(m):bodyBack(m); }
function storageKey(pid) { return 'fittrack_'+pid; }

// ─── Date Utils ───
function getMonday(d) {
  const date=new Date(d);const day=date.getDay();
  const diff=date.getDate()-day+(day===0?-6:1);
  date.setDate(diff);date.setHours(0,0,0,0);return date;
}
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function weekKey(d) { return dateKey(getMonday(d)); }
function formatDate(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }

const today=new Date();today.setHours(0,0,0,0);
const todayDow=today.getDay()===0?6:today.getDay()-1;

// ─── State ───
let state = {
  currentTab:'treino', currentProfile:'pedro',
  selectedWeek:getMonday(today), selectedDay:todayDow,
  workouts:[], completed:{}, weightLog:[], setLogs:{},
  expandedExercise:null, userName:'Pedro',
  restTimerSeconds:90, restTimerRunning:false, restTimerRemaining:0, restTimerInterval:null
};

function applyTheme(pid) {
  const p=PROFILES[pid],r=document.documentElement;
  r.style.setProperty('--accent',p.accent);
  r.style.setProperty('--accent-dim',p.accentDim);
  r.style.setProperty('--accent-glow',p.accentGlow);
  r.style.setProperty('--accent-secondary',p.accentSecondary);
}

function loadProfile(pid) {
  state.currentProfile=pid;
  state.userName=PROFILES[pid].name;
  state.workouts=pid==='pedro'?getPedroWorkouts():getLaisWorkouts();
  state.completed={};
  state.weightLog=[];
  state.setLogs={};
  try {
    const saved=localStorage.getItem(storageKey(pid));
    if(saved){const d=JSON.parse(saved);if(d.completed)state.completed=d.completed;if(d.weightLog)state.weightLog=d.weightLog;if(d.workouts)state.workouts=d.workouts;if(d.setLogs)state.setLogs=d.setLogs;}
  } catch(e){}
  applyTheme(pid);
  try{localStorage.setItem('fittrack_active',pid);}catch(e){}
}

function saveState() {
  try {
    localStorage.setItem(storageKey(state.currentProfile),JSON.stringify({
      completed:state.completed,weightLog:state.weightLog,workouts:state.workouts,setLogs:state.setLogs
    }));
  } catch(e){}
  saveToFirestore();
}

function switchProfile(pid) {
  if(pid===state.currentProfile)return;
  state.selectedWeek=getMonday(today);
  state.selectedDay=todayDow;
  state.expandedExercise=null;
  state.currentTab='treino';
  loadProfile(pid);
  saveState();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-treino').classList.add('active');
  renderAll();
  showToast('Perfil: '+PROFILES[pid].name);
}

// ─── Exercise Logic ───
function isExerciseDone(wk,di,ei){return state.completed[wk]?.[di]?.includes(ei)||false;}
function toggleExercise(wk,di,ei){
  if(!state.completed[wk])state.completed[wk]={};
  if(!state.completed[wk][di])state.completed[wk][di]=[];
  const arr=state.completed[wk][di];
  const idx=arr.indexOf(ei);
  if(idx>-1)arr.splice(idx,1);else arr.push(ei);
  saveState();
}
function getDayCompletion(wk,di){
  const w=state.workouts[di];
  if(!w||w.rest||w.exercises.length===0)return{done:0,total:0,pct:0};
  const total=w.exercises.length;
  const done=(state.completed[wk]?.[di]||[]).length;
  return{done,total,pct:Math.round((done/total)*100)};
}
function getWeekCompletion(wk){
  let done=0,total=0;
  for(let i=0;i<7;i++){const c=getDayCompletion(wk,i);done+=c.done;total+=c.total;}
  return{done,total,pct:total>0?Math.round((done/total)*100):0};
}
function getGreeting(){const h=new Date().getHours();if(h<12)return'Bom dia';if(h<18)return'Boa tarde';return'Boa noite';}

const checkSVG=`<svg viewBox="0 0 14 14" fill="none"><path d="M3 7.5L5.5 10L11 4" stroke="#0A0A0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const navIcons={
  treino:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M4 12h16M6.5 17.5h11"/><circle cx="4" cy="6.5" r="1.5"/><circle cx="20" cy="6.5" r="1.5"/><circle cx="4" cy="17.5" r="1.5"/><circle cx="20" cy="17.5" r="1.5"/></svg>`,

  relatorios:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>`,
  perfil:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 17 7 14 12 14C17 14 20 17 20 20"/></svg>`
};

function renderNav(){

    `<button class="nav-item ${state.currentTab===tab?'active':''}" onclick="switchTab('${tab}')">

// ─── Render Header ───
function renderHeader(){
  const header=document.getElementById('header');
  if(state.currentTab!=='treino'){header.innerHTML='';return;}
  const monday=new Date(state.selectedWeek);
  const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
  const wk=dateKey(state.selectedWeek);
  const profileBtns=Object.values(PROFILES).map(p=>
    `<div class="profile-avatar ${p.id===state.currentProfile?'active':''}" style="background:${p.avatarBg}" onclick="switchProfile('${p.id}')" title="${p.name}">${p.initials}</div>`
  ).join('');
  let daysHtml='';
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(d.getDate()+i);
    const comp=getDayCompletion(wk,i);
    const isComplete=comp.total>0&&comp.done===comp.total;
    const isRest=state.workouts[i]?.rest;
    let cls='day-tab';
    if(i===state.selectedDay)cls+=' active';
    if(isComplete)cls+=' completed';
    if(isRest)cls+=' rest';
    daysHtml+=`<div class="${cls}" onclick="selectDay(${i})"><div class="day-name">${DAYS[i]}</div><div class="day-num">${d.getDate()}</div></div>`;
  }
  header.innerHTML=`
    <div class="header-top"><div class="greeting">${getGreeting()}<strong>${state.userName}</strong></div><div class="profile-switcher">${profileBtns}</div></div>
    <div class="week-nav"><button onclick="changeWeek(-1)">&larr;</button><span>${weekKey(state.selectedWeek)===weekKey(today)?'Esta semana':formatDate(monday)+' - '+formatDate(sunday)}</span><button onclick="changeWeek(1)">&rarr;</button></div>
    <div class="days-row">${daysHtml}</div>`;
}

function selectDay(i){state.selectedDay=i;state.expandedExercise=null;renderHeader();renderTreino();}
function changeWeek(dir){const d=new Date(state.selectedWeek);d.setDate(d.getDate()+dir*7);state.selectedWeek=d;renderHeader();renderTreino();}

function renderCurrentView(){
  switch(state.currentTab){
    case'treino':renderTreino();break;case'progresso':renderProgresso();break;
    case'relatorios':renderRelatorios();break;case'perfil':renderPerfil();break;
  }
}

// ─── Render Treino ───
function renderTreino(){
  const view=document.getElementById('view-treino');
  const wk=dateKey(state.selectedWeek);
  const workout=state.workouts[state.selectedDay];
  if(!workout||workout.rest){
    const restMsg=workout?.tag==='Recuperação • Aeróbico'?'Dia ideal para cardio (esteira, escada ou bike) ou descanso total.':'Descanse, hidrate-se e prepare-se para o próximo treino.';
    view.innerHTML=`<div class="rest-day"><div class="rest-day-icon">&#x1F4A4;</div><h3>${workout?.name||'Descanso'}</h3><p>${restMsg}</p></div>`;return;
  }
  const comp=getDayCompletion(wk,state.selectedDay);
  let html=`<div class="muscle-badge-row">${workout.tag.split('•').map(t=>`<span class="muscle-badge">${t.trim()}</span>`).join('')}</div>
    <div class="progress-bar-container"><div class="progress-label"><span>${DAYS_FULL[state.selectedDay]} — ${workout.name}</span><span>${comp.done}/${comp.total}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${comp.pct}%"></div></div></div>`;
  workout.exercises.forEach((ex,i)=>{
    const done=isExerciseDone(wk,state.selectedDay,i);
    const expanded=state.expandedExercise===i;
    html+=`<div class="exercise-card ${done?'done':''} ${expanded?'expanded':''}" onclick="toggleExpand(${i})">
      <div class="exercise-top">
        <button class="exercise-check ${done?'checked':''}" onclick="event.stopPropagation();checkExercise(${i})">${done?checkSVG:''}</button>
        <div class="exercise-info"><div class="exercise-name">${ex.name}</div><div class="exercise-sets"><span>${ex.sets}</span> séries × <span>${ex.reps}</span> repetições</div></div>
        <div class="exercise-body-map">${getBodySVG(ex.view,ex.muscles)}</div>
      </div>
      <div class="exercise-detail">
        <p class="exercise-instruction">${ex.instruction}</p>
        ${renderSetsTracker(wk,state.selectedDay,i,ex)}
      </div>
    </div>`;
  });
  view.innerHTML=html;
}

function getSetLogKey(wk,di,ei) { return wk+'_'+di+'_'+ei; }
function getSetLog(wk,di,ei,si) {
  const key=getSetLogKey(wk,di,ei);
  return state.setLogs[key]?.[si] || {kg:'',reps:'',done:false};
}
function updateSetLog(wk,di,ei,si,field,value) {
  const key=getSetLogKey(wk,di,ei);
  if(!state.setLogs[key]) state.setLogs[key]=[];
  if(!state.setLogs[key][si]) state.setLogs[key][si]={kg:'',reps:'',done:false};
  state.setLogs[key][si][field]=value;
  saveState();
}
function toggleSetDone(wk,di,ei,si) {
  const key=getSetLogKey(wk,di,ei);
  if(!state.setLogs[key]) state.setLogs[key]=[];
  if(!state.setLogs[key][si]) state.setLogs[key][si]={kg:'',reps:'',done:false};
  state.setLogs[key][si].done = !state.setLogs[key][si].done;
  if(state.setLogs[key][si].done) startRestTimer();
  const ex=state.workouts[di].exercises[ei];
  const allDone=ex && state.setLogs[key] && state.setLogs[key].filter(s=>s&&s.done).length>=ex.sets;
  if(allDone && !isExerciseDone(wk,di,ei)) { toggleExercise(wk,di,ei); renderHeader(); }
  else if(!allDone && isExerciseDone(wk,di,ei)) { toggleExercise(wk,di,ei); renderHeader(); }
  saveState();
  renderTreino();
}

function renderSetsTracker(wk,di,ei,ex) {
  let html=`<div class="sets-header"><span class="sh-set">Série</span><span class="sh-kg">Kg</span><span class="sh-reps">Reps</span><span class="sh-spacer"></span></div><div class="sets-tracker">`;
  for(let s=0;s<ex.sets;s++){
    const log=getSetLog(wk,di,ei,s);
    html+=`<div class="set-row ${log.done?'done':''}">
      <div class="set-num">${s+1}</div>
      <div class="set-inputs">
        <input class="set-input" type="number" placeholder="kg" value="${log.kg}" min="0" step="0.5"
          onclick="event.stopPropagation()" onchange="updateSetLog('${wk}',${di},${ei},${s},'kg',this.value)">
        <input class="set-input" type="number" placeholder="reps" value="${log.reps}" min="0"
          onclick="event.stopPropagation()" onchange="updateSetLog('${wk}',${di},${ei},${s},'reps',this.value)">
      </div>
      <button class="set-check-btn ${log.done?'checked':''}" onclick="event.stopPropagation();toggleSetDone('${wk}',${di},${ei},${s})">${log.done?checkSVG:''}</button>
    </div>`;
  }
  html+=`</div>`;
  html+=renderRestTimer();
  return html;
}

let timerInterval=null;
let timerRemaining=0;
let timerRunning=false;
let timerDuration=90;

function renderRestTimer() {
  const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0');
  const ss=String(timerRemaining%60).padStart(2,'0');
  const playSVG=`<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
  const pauseSVG=`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>`;
  const resetSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-11.36L3 10"/></svg>`;
  return `<div class="rest-timer">
    <button class="timer-btn reset" onclick="event.stopPropagation();resetTimer()">${resetSVG}</button>
    <div class="timer-display ${timerRunning?'running':''}">${mm}:${ss}</div>
    <button class="timer-btn ${timerRunning?'stop':'start'}" onclick="event.stopPropagation();${timerRunning?'pauseTimer()':'startRestTimer()'}">${timerRunning?pauseSVG:playSVG}</button>
  </div>
  <div class="timer-presets">
    ${[30,60,90,120].map(s=>`<button class="timer-preset ${timerDuration===s?'active':''}" onclick="event.stopPropagation();setTimerDuration(${s})">${s>=60?(s/60)+'min':s+'s'}</button>`).join('')}
  </div>`;
}

function startRestTimer() {
  if(timerRunning) return;
  timerRemaining=timerDuration;
  timerRunning=true;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timerRemaining--;
    if(timerRemaining<=0){
      clearInterval(timerInterval);
      timerRunning=false;
      timerRemaining=0;
      try { if(navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
      showToast('Descanso finalizado!');
    }
    updateTimerDisplay();
  },1000);
  updateTimerDisplay();
}

function pauseTimer() {
  timerRunning=false;
  if(timerInterval) clearInterval(timerInterval);
  updateTimerDisplay();
}

function resetTimer() {
  timerRunning=false;
  if(timerInterval) clearInterval(timerInterval);
  timerRemaining=0;
  updateTimerDisplay();
}

function setTimerDuration(s) {
  timerDuration=s;
  if(!timerRunning) timerRemaining=0;
  renderTreino();
}

function updateTimerDisplay() {
  const el=document.querySelector('.timer-display');
  if(!el) return;
  const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0');
  const ss=String(timerRemaining%60).padStart(2,'0');
  el.textContent=mm+':'+ss;
  el.className='timer-display'+(timerRunning?' running':'');
  const btn=document.querySelector('.rest-timer .timer-btn:last-child');
  if(btn) {
    btn.className='timer-btn '+(timerRunning?'stop':'start');
    const playSVG=`<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
    const pauseSVG=`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>`;
    btn.innerHTML=timerRunning?pauseSVG:playSVG;
    btn.setAttribute('onclick','event.stopPropagation();'+(timerRunning?'pauseTimer()':'startRestTimer()'));
  }
}

function checkExercise(i){toggleExercise(dateKey(state.selectedWeek),state.selectedDay,i);renderTreino();renderHeader();}
function toggleExpand(i){state.expandedExercise=state.expandedExercise===i?null:i;renderTreino();}

// ─── Render Progresso ───
function renderWeightChart(data){
  if(data.length<2)return'<p style="color:var(--text-sec);font-size:13px;">Adicione pelo menos 2 registros.</p>';
  const p=PROFILES[state.currentProfile];
  const last10=data.slice(-10);
  const W=320,H=140,PL=40,PR=10,PT=10,PB=30;
  const cw=W-PL-PR,ch=H-PT-PB;
  const vals=last10.map(d=>d.weight);
  const min=Math.min(...vals)-0.5,max=Math.max(...vals)+0.5,range=max-min||1;
  const pts=last10.map((d,i)=>({x:PL+(i/(last10.length-1))*cw,y:PT+ch-((d.weight-min)/range)*ch}));
  const linePath=pts.map((pt,i)=>`${i===0?'M':'L'}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' ');
  const areaPath=linePath+` L${pts[pts.length-1].x.toFixed(1)},${H-PB} L${pts[0].x.toFixed(1)},${H-PB} Z`;
  let gridSvg='';
  for(let i=0;i<=4;i++){const y=PT+(i/4)*ch;const val=max-(i/4)*range;gridSvg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#2A2A2E" stroke-width="0.5"/><text x="${PL-6}" y="${y+3}" fill="#5A5A5E" font-size="9" text-anchor="end" font-family="Inter">${val.toFixed(1)}</text>`;}
  let labelSvg='';
  last10.forEach((d,i)=>{if(i%Math.ceil(last10.length/5)===0||i===last10.length-1){const dt=new Date(d.date+'T12:00:00');labelSvg+=`<text x="${pts[i].x}" y="${H-PB+14}" fill="#5A5A5E" font-size="9" text-anchor="middle" font-family="Inter">${dt.getDate()}/${dt.getMonth()+1}</text>`;}});
  const dotsSvg=pts.map((pt,i)=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="${i===pts.length-1?p.chartLine:p.chartDot}" stroke="#0A0A0C" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg"><defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p.chartLine}" stop-opacity="0.2"/><stop offset="100%" stop-color="${p.chartLine}" stop-opacity="0"/></linearGradient></defs>${gridSvg}<path d="${areaPath}" fill="url(#areaG)"/><path d="${linePath}" fill="none" stroke="${p.chartLine}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dotsSvg}${labelSvg}</svg>`;
}

function renderProgresso(){
  const view=document.getElementById('view-progresso');
  const latest=state.weightLog[state.weightLog.length-1];
  const prev=state.weightLog.length>1?state.weightLog[state.weightLog.length-2]:null;
  const diff=prev?(latest.weight-prev.weight).toFixed(1):0;
  const initial=state.weightLog[0];
  const totalDiff=latest&&initial?(latest.weight-initial.weight).toFixed(1):'0';
  let html=`<h2 class="section-title" style="margin-top:16px">Registrar Peso</h2>
    <div class="weight-input-row"><input type="number" id="weightInput" placeholder="Ex: 75.5" step="0.1" min="30" max="300"><button class="btn" onclick="addWeight()">Salvar</button></div>
    <div class="stat-cards">
      <div class="stat-card accent"><div class="stat-icon green">&#9878;</div><div class="stat-value">${latest?latest.weight.toFixed(1):'--'}<small style="font-size:12px;font-weight:500;color:var(--text-sec)"> kg</small></div><div class="stat-label">Peso Atual</div></div>
      <div class="stat-card"><div class="stat-icon ${parseFloat(diff)<=0?'green':'red'}">${parseFloat(diff)<=0?'&#9660;':'&#9650;'}</div><div class="stat-value" style="color:${parseFloat(diff)<=0?'var(--accent)':'var(--danger)'}">${diff>0?'+':''}${diff}<small style="font-size:12px;font-weight:500;color:var(--text-sec)"> kg</small></div><div class="stat-label">Última Variação</div></div>
    </div>
    <h2 class="section-title">Evolução do Peso</h2>
    <div class="chart-container"><div class="chart-header"><div><div class="chart-title">Peso Corporal</div><div class="chart-subtitle">Últimos ${Math.min(state.weightLog.length,10)} registros</div></div><div><div class="chart-value">${totalDiff>0?'+':''}${totalDiff} kg</div><div class="chart-subtitle" style="text-align:right">Total</div></div></div>${renderWeightChart(state.weightLog)}</div>
    <h2 class="section-title">Histórico</h2>
    <div class="chart-container" style="padding:12px;max-height:240px;overflow-y:auto;">`;
  [...state.weightLog].reverse().forEach((entry,i,arr)=>{
    const dt=new Date(entry.date+'T12:00:00');const prevE=arr[i+1];
    const change=prevE?(entry.weight-prevE.weight).toFixed(1):null;
    html+=`<div class="weight-history-item"><span class="date">${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}</span><span class="value">${entry.weight.toFixed(1)} kg</span>${change!==null?`<span class="change ${parseFloat(change)<=0?'down':'up'}">${parseFloat(change)>0?'+':''}${change}</span>`:'<span class="change">—</span>'}</div>`;
  });
  html+='</div>';
  view.innerHTML=html;
}

function addWeight(){
  const val=parseFloat(document.getElementById('weightInput')?.value);
  if(isNaN(val)||val<30||val>300){showToast('Insira um peso válido (30-300 kg)');return;}
  const todayStr=dateKey(today);
  const existing=state.weightLog.findIndex(e=>e.date===todayStr);
  if(existing>-1)state.weightLog[existing].weight=val;
  else{state.weightLog.push({date:todayStr,weight:val});state.weightLog.sort((a,b)=>a.date.localeCompare(b.date));}
  saveState();showToast('Peso registrado: '+val.toFixed(1)+' kg');renderProgresso();
}

// ─── Render Relatórios ───
function renderRelatorios(){
  const view=document.getElementById('view-relatorios');
  const p=PROFILES[state.currentProfile];
  let totalDays=0,muscleCount={},dayCount=[0,0,0,0,0,0,0];
  const mn={chest:'Peitoral',shoulders:'Ombros',biceps:'Bíceps',triceps:'Tríceps',forearms:'Antebraço',abs:'Abdômen',obliques:'Oblíquos',quads:'Quadríceps',glutes:'Glúteos',hamstrings:'Posterior',calves:'Panturrilha',lats:'Dorsal',traps:'Trapézio','rear-delts':'Deltóide Post.','lower-back':'Lombar'};
  Object.entries(state.completed).forEach(([wk,days])=>{
    Object.entries(days).forEach(([di,exList])=>{
      const d=parseInt(di);
      if(exList.length>0){const w=state.workouts[d];if(w&&!w.rest){if(exList.length>=Math.ceil(w.exercises.length*0.5)){totalDays++;dayCount[d]++;}exList.forEach(ei=>{const ex=w.exercises[ei];if(ex)ex.muscles.forEach(m=>{muscleCount[m]=(muscleCount[m]||0)+1;});});}}
    });
  });
  let streak=0;const td=new Date(today);
  while(true){const dow=td.getDay()===0?6:td.getDay()-1;const wk=dateKey(getMonday(td));const w=state.workouts[dow];if(w&&w.rest){td.setDate(td.getDate()-1);continue;}const c=getDayCompletion(wk,dow);if(c.total>0&&c.done>=Math.ceil(c.total*0.5)){streak++;td.setDate(td.getDate()-1);}else break;}
  const wc=getWeekCompletion(dateKey(state.selectedWeek));
  let html=`<h2 class="section-title" style="margin-top:16px">Resumo</h2>
    <div class="stat-cards">
      <div class="stat-card accent"><div class="stat-icon green">&#128293;</div><div class="stat-value">${streak}</div><div class="stat-label">Dias de Sequência</div></div>
      <div class="stat-card"><div class="stat-icon blue">&#128170;</div><div class="stat-value">${totalDays}</div><div class="stat-label">Total de Treinos</div></div>
      <div class="stat-card"><div class="stat-icon orange">&#127942;</div><div class="stat-value">${wc.pct}%</div><div class="stat-label">Semana Atual</div></div>
      <div class="stat-card"><div class="stat-icon green">&#9989;</div><div class="stat-value">${wc.done}/${wc.total}</div><div class="stat-label">Exercícios Semana</div></div>
    </div>
    <h2 class="section-title">Grupos Musculares</h2><div class="chart-container"><div class="chart-title" style="margin-bottom:12px;">Frequência de Treino por Músculo</div>`;
  const sorted=Object.entries(muscleCount).sort((a,b)=>b[1]-a[1]);
  const maxC=sorted.length>0?sorted[0][1]:1;
  if(sorted.length===0)html+='<p style="color:var(--text-sec);font-size:13px;">Comece a treinar para ver as estatísticas.</p>';
  else sorted.forEach(([m,c])=>{const pct=(c/maxC)*100;const color=pct>70?p.accent:pct>40?p.accentSecondary:pct>20?'#7C7C74':'#5A5A5E';html+=`<div class="bar-chart-row"><span class="bar-label">${mn[m]||m}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div><span class="bar-value">${c}x</span></div>`;});
  html+='</div>';
  html+=`<h2 class="section-title">Treinos por Dia da Semana</h2><div class="chart-container">`;
  const maxDC=Math.max(...dayCount,1);
  for(let i=0;i<7;i++){const pct=(dayCount[i]/maxDC)*100;html+=`<div class="bar-chart-row"><span class="bar-label">${DAYS_FULL[i]}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${state.workouts[i]?.rest?'#3A3A3E':p.accent};"></div></div><span class="bar-value">${dayCount[i]}x</span></div>`;}
  html+='</div>';
  html+=`<h2 class="section-title">Últimas 4 Semanas</h2><div class="chart-container"><div class="heatmap-grid">${DAYS.map(d=>`<div class="heatmap-label">${d}</div>`).join('')}`;
  for(let w=-3;w<=0;w++){const ws=new Date(getMonday(today));ws.setDate(ws.getDate()+w*7);const wk=dateKey(ws);for(let d=0;d<7;d++){const cd=new Date(ws);cd.setDate(cd.getDate()+d);const isFuture=cd>today,isT=dateKey(cd)===dateKey(today);const comp=getDayCompletion(wk,d);let cls='heatmap-cell';if(isFuture)cls+=' future';else if(isT)cls+=' today';if(!isFuture&&comp.total>0){if(comp.done===comp.total)cls+=' trained-full';else if(comp.done>0)cls+=' trained';}html+=`<div class="${cls}" title="${formatDate(cd)}: ${comp.done}/${comp.total}"></div>`;}}
  html+='</div></div>';
  view.innerHTML=html;
}

// ─── Render Perfil ───
function renderPerfil(){
  const view=document.getElementById('view-perfil');
  let html=`<h2 class="section-title" style="margin-top:16px">Perfis</h2>`;
  Object.values(PROFILES).forEach(p=>{
    const isActive=p.id===state.currentProfile;
    html+=`<div class="profile-card" onclick="switchProfile('${p.id}')" style="${isActive?'border-color:'+p.accentGlow:''}">
      <div class="profile-card-left">
        <div class="profile-avatar ${isActive?'active':''}" style="background:${p.avatarBg};width:36px;height:36px;font-size:14px;border-color:${isActive?p.accent:'transparent'}">${p.initials}</div>
        <div class="profile-card-text"><div class="label">${p.name}</div><div class="sub">${isActive?'Perfil ativo':'Toque para trocar'}</div></div>
      </div>
      ${isActive?`<span style="color:${p.accent};font-size:11px;font-weight:600;">ATIVO</span>`:'<div class="profile-card-arrow">&rsaquo;</div>'}
    </div>`;
  });
  html+=`<h2 class="section-title">Treino de ${state.userName}</h2>`;
  state.workouts.forEach((w,i)=>{
    const isRest=w.rest&&w.exercises.length===0;
    const icon=isRest?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5h11M4 12h16M6.5 17.5h11"/></svg>`;
    const sub=isRest?'Descanso — toque para adicionar treino':`${w.exercises.length} exercícios`;
    html+=`<div class="profile-card" onclick="editWorkout(${i})" style="${isRest?'opacity:0.6':''}">
      <div class="profile-card-left"><div class="profile-card-icon">${icon}</div><div class="profile-card-text"><div class="label">${DAYS_FULL[i]}: ${w.name}</div><div class="sub">${sub}</div></div></div>
      <div class="profile-card-arrow">&rsaquo;</div>
    </div>`;
  });
  html+=`<h2 class="section-title">Dados</h2>
    <div class="profile-card" onclick="exportData()"><div class="profile-card-left"><div class="profile-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M5 10l7 7 7-7"/><path d="M5 21h14"/></svg></div><div class="profile-card-text"><div class="label">Exportar Dados</div><div class="sub">Copiar dados para backup</div></div></div><div class="profile-card-arrow">&rsaquo;</div></div>
    <div class="profile-card" onclick="importData()"><div class="profile-card-left"><div class="profile-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M5 14l7-7 7 7"/><path d="M5 21h14"/></svg></div><div class="profile-card-text"><div class="label">Importar Dados</div><div class="sub">Restaurar backup anterior</div></div></div><div class="profile-card-arrow">&rsaquo;</div></div>
    <div style="margin-top:16px"><button class="btn danger" style="width:100%" onclick="resetData()">Resetar Dados de ${state.userName}</button></div>`;
  view.innerHTML=html;
}

// ─── Modals / Edit ───
function editWorkout(dayIdx){
  const w=state.workouts[dayIdx];
  let html=`<div class="modal-header"><div class="modal-title">${DAYS_FULL[dayIdx]}: ${w.name}</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="form-group"><label class="form-label">Nome do Treino</label><input class="form-input" id="workoutNameInput" value="${w.name}"></div>
    <div class="form-group"><label class="form-label">Músculos (separados por •)</label><input class="form-input" id="workoutTagInput" value="${w.tag}"></div>
    <div class="form-label" style="margin:12px 0 8px;">Exercícios</div>`;
  w.exercises.forEach((ex,i)=>{html+=`<div class="edit-exercise-item"><div style="flex:1;min-width:0;"><div class="name">${ex.name}</div><div class="detail">${ex.sets} × ${ex.reps}</div></div><button onclick="removeExercise(${dayIdx},${i})" title="Remover">&times;</button></div>`;});
  html+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
    <div class="form-label">Adicionar Exercício</div>
    <input class="form-input" id="newExName" placeholder="Nome do exercício" style="margin-bottom:8px;">
    <div style="display:flex;gap:8px;margin-bottom:8px;"><input class="form-input" id="newExSets" placeholder="Séries" type="number" style="width:80px;"><input class="form-input" id="newExReps" placeholder="Reps" style="flex:1;"></div>
    <input class="form-input" id="newExInstruction" placeholder="Instrução (opcional)" style="margin-bottom:10px;">
    <button class="btn small secondary" onclick="addExercise(${dayIdx})" style="width:100%;">+ Adicionar</button>
  </div>
  <div style="margin-top:14px;"><button class="btn" style="width:100%;" onclick="saveWorkoutEdit(${dayIdx})">Salvar Alterações</button></div>`;
  openModal(html);
}
function removeExercise(d,e){state.workouts[d].exercises.splice(e,1);saveState();editWorkout(d);showToast('Exercício removido');}
function addExercise(d){
  const name=document.getElementById('newExName')?.value?.trim();
  if(!name){showToast('Digite o nome');return;}
  state.workouts[d].exercises.push({name,sets:parseInt(document.getElementById('newExSets')?.value)||3,reps:document.getElementById('newExReps')?.value?.trim()||'12',view:'front',muscles:[],instruction:document.getElementById('newExInstruction')?.value?.trim()||''});
  saveState();editWorkout(d);showToast('Exercício adicionado');
}
function saveWorkoutEdit(d){
  const name=document.getElementById('workoutNameInput')?.value?.trim();
  const tag=document.getElementById('workoutTagInput')?.value?.trim();
  if(name)state.workouts[d].name=name;if(tag)state.workouts[d].tag=tag;
  if(state.workouts[d].exercises.length>0)state.workouts[d].rest=false;
  else state.workouts[d].rest=true;
  saveState();closeModal();renderPerfil();renderHeader();if(state.selectedDay===d)renderTreino();showToast('Treino atualizado');
}
function exportData(){
  const data=JSON.stringify({completed:state.completed,weightLog:state.weightLog,workouts:state.workouts,setLogs:state.setLogs},null,2);
  openModal(`<div class="modal-header"><div class="modal-title">Exportar Dados</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p style="font-size:13px;color:var(--text-sec);margin:0 0 10px;">Copie o texto abaixo e salve em um lugar seguro.</p>
    <textarea class="form-input" style="height:200px;font-size:11px;font-family:monospace;resize:vertical;" readonly onclick="this.select()">${data}</textarea>
    <button class="btn" style="width:100%;margin-top:10px;" onclick="navigator.clipboard?.writeText(document.querySelector('.modal textarea').value).then(()=>showToast('Copiado!')).catch(()=>{})">Copiar</button>`);
}
function importData(){
  openModal(`<div class="modal-header"><div class="modal-title">Importar Dados</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p style="font-size:13px;color:var(--text-sec);margin:0 0 10px;">Cole os dados exportados anteriormente.</p>
    <textarea class="form-input" id="importTextarea" style="height:200px;font-size:11px;font-family:monospace;resize:vertical;" placeholder="Cole aqui..."></textarea>
    <button class="btn" style="width:100%;margin-top:10px;" onclick="doImport()">Importar</button>`);
}
function doImport(){
  try{const d=JSON.parse(document.getElementById('importTextarea')?.value);
    if(d.completed)state.completed=d.completed;if(d.weightLog)state.weightLog=d.weightLog;if(d.workouts)state.workouts=d.workouts;if(d.setLogs)state.setLogs=d.setLogs;
    saveState();closeModal();showToast('Dados importados');renderAll();
  }catch(e){showToast('Dados inválidos');}
}
function resetData(){
  if(!confirm('Tem certeza? Os dados de '+state.userName+' serão apagados.'))return;
  try{localStorage.removeItem(storageKey(state.currentProfile));}catch(e){}
  loadProfile(state.currentProfile);saveState();showToast('Dados resetados');renderAll();
}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalOverlay').classList.add('open');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function renderAll(){renderNav();renderHeader();renderCurrentView();}
</script>
</body>
</html>
